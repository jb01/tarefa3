{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card login-card">
    <h2>Login</h2>
    <div id="client-error" class="alert alert-error" style="display: none;"></div>
    <form method="POST" action="{{ url_for('login') }}" id="login-form" novalidate>
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" autofocus autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="current-password">
        </div>

        <div class="form-actions">
            <button type="submit" id="btn-ok" class="btn btn-primary">OK</button>
            <button type="button" id="btn-limpar" class="btn btn-secondary" onclick="limparCampos()">Limpar</button>
        </div>
    </form>
</div>

<script>
function limparCampos() {
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    const errDiv = document.getElementById('client-error');
    if (errDiv) {
        errDiv.style.display = 'none';
        errDiv.textContent = '';
    }
    document.getElementById('username').focus();
}

document.getElementById('login-form').addEventListener('submit', function(e) {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errDiv = document.getElementById('client-error');

    if (!username && !password) {
        e.preventDefault();
        errDiv.textContent = 'Informe usuário e senha.';
        errDiv.style.display = 'block';
        document.getElementById('username').focus();
    } else if (!username) {
        e.preventDefault();
        errDiv.textContent = 'Informe o usuário.';
        errDiv.style.display = 'block';
        document.getElementById('username').focus();
    } else if (!password) {
        e.preventDefault();
        errDiv.textContent = 'Informe a senha.';
        errDiv.style.display = 'block';
        document.getElementById('password').focus();
    }
});
</script>
{% endblock %}
