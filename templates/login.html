{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card login-card">
    <h2>Login</h2>
    <form method="POST" action="{{ url_for('login') }}" id="login-form">
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <div class="form-actions">
            <button type="submit" id="btn-ok" class="btn btn-primary">OK</button>
            <button type="reset" id="btn-limpar" class="btn btn-secondary" onclick="document.getElementById('username').value=''; document.getElementById('password').value='';">Limpar</button>
        </div>
    </form>
</div>
{% endblock %}
