{% extends "base.html" %}

{% block title %}Cadastro de Usuários{% endblock %}

{% block content %}
<div class="card register-card">
    <div class="card-header">
        <h2>Cadastro de Usuários</h2>
        <span class="user-badge">Administrador: {{ session.get('username') }}</span>
    </div>

    <form method="POST" action="{{ url_for('register') }}" id="register-form">
        <div class="form-group">
            <label for="username">Nome de Usuário</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required autocomplete="new-password">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </div>
    </form>

    <div class="card-footer">
        <a href="{{ url_for('logout') }}" class="link-logout">Sair</a>
    </div>
</div>
{% endblock %}
